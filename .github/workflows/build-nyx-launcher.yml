name: Build Nyx Roleplay Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-nyx-launcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Gradle project
        run: gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nyx-Roleplay-Launcher-debug
          path: launcher/app/build/outputs/apk/debug/app-debug.apk

name: Build Nyx Roleplay Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-nyx-launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-nyx-launcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          find launcher/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -size +0c -print
          test -s launcher/app/build/outputs/apk/release/app-release.apk
          ls -lh launcher/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Mythos-Launcher-2.2.0-release
          path: ${{ github.workspace }}/launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

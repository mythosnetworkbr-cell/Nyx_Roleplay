name: Build Nyx Roleplay Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-nyx-native.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Build native debug APK
        run: ./gradlew assembleDebug
      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Nyx-Roleplay-Native-debug
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
